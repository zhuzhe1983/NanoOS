name: Publish NanoOS website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble the public website
        run: |
          mkdir -p _site/assets
          cp index.html ai.html _site/
          cp assets/icon.svg assets/site.css assets/site.js assets/flash-policy.mjs _site/assets/
          cp assets/screen-home.png assets/screen-music.png assets/screen-reader.png assets/screen-calendar.png _site/assets/
          touch _site/.nojekyll
      - name: Upload only the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
